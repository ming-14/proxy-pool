<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>LogPanel 虚拟视图探针</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a1a1a; color: #eee; font: 12px system-ui; }
</style>
</head>
<body>
<script type="module">
/**
 * LogPanel 虚拟滚动探针页（仅供 tests/e2e/web/test_logpanel_virtual.py 使用）。
 *
 * 直接 import 组件源码并以假日志源驱动，原因：虚拟滚动的缺陷只在「行数远多于视口、
 * 行高可变」时出现，而后端真实日志难以在测试里灌到这个量级。
 * 随机数走固定种子 LCG：数据分布确定，断言才可重复。
 */
import { LogPanel } from '../../../frontend/src/vendor/logpanel/index.js';

const CAP = 2000;
const TAGS = ['use_cases.fetch_proxies', 'interfaces.proxy_server', 'framework.web.api',
              'entities.proxy', 'infra.geolocation', 'scheduler'];

let seed = 20260917;
function rnd() {
  seed = (seed * 1103515245 + 12345) & 0x7fffffff;
  return seed / 0x7fffffff;
}

let entries = [];
let seq = 0;
let listener = null;

// 行高分布贴近真实面板：多数 1 行短日志，少量 2 行，极少数 3-4 行（可展开的 WARN/ERROR）
function makeEntry() {
  seq += 1;
  const r = rnd();
  const kind = r < 0.75 ? 0 : (r < 0.95 ? 1 : 2);
  let text;
  if (kind === 0) {
    text = `心跳正常 延时 ${20 + (seq % 80)}ms`;
  } else if (kind === 1) {
    text = `校验通过 10.0.${seq % 255}.${seq % 99}:8080 延时 ${seq % 300}ms 已入组`;
  } else {
    text = `拉取批次 #${seq} 完成，共 ${seq % 50} 个代理，`
         + `其中 ${seq % 7} 个校验失败已丢弃，耗时 ${seq % 900}ms，下次调度在 60s 后`;
  }
  const isErr = kind === 2 && seq % 3 === 0;
  return {
    seq, ts: Date.now(),
    level: isErr ? 3 : (kind === 2 ? 2 : 1),
    levelName: isErr ? 'ERROR' : (kind === 2 ? 'WARN' : 'INFO'),
    tag: TAGS[seq % TAGS.length],
    text,
    stack: isErr ? 'Traceback (most recent call last):\n  File "x.py", line ' + seq + ', in run\n    raise RuntimeError("boom")' : null,
    hasStack: isErr,
  };
}

const source = {
  subscribe(cb) { listener = cb; return () => { listener = null; }; },
  getEntries() { return entries; },
  clear() { entries = []; if (listener) listener({ type: 'clear' }); },
  getSize() { return entries.length; },
  getCapacity() { return CAP; },
};

const panel = new LogPanel({
  source,
  rules: { tag: (e) => e.tag.replace(/^src\./, '') },
  theme: 'dark',
  title: '控制台日志',
  storageKeyPrefix: 'probe-logpanel_',
  initialVisible: true,
  initialGeometry: { x: 40, y: 40, w: 720, h: 480, zoom: 1 },
});

const host = document.getElementById('logpanel-host');
const sr = host.shadowRoot;
const body = sr.querySelector('#lp-right');

// 运行时计数：不改动组件源码即可统计窗口重建与补窗
let paintCount = 0;
const origPaint = panel._paint.bind(panel);
panel._paint = function (...a) { paintCount += 1; return origPaint(...a); };
let coverageHits = 0;
const origCoverage = panel._ensureCoverage.bind(panel);
panel._ensureCoverage = function (top, clientH) {
  const s0 = panel._range.start, e0 = panel._range.end;
  const r = origCoverage(top, clientH);
  if (panel._range.start !== s0 || panel._range.end !== e0) coverageHits += 1;
  return r;
};

function push(n) {
  const arr = [];
  for (let i = 0; i < n; i++) arr.push(makeEntry());
  entries = entries.concat(arr);
  if (entries.length > CAP) entries = entries.slice(-CAP);
  for (const e of arr) { if (listener) listener(e); }   // 真实链路是逐条回调
  return entries.length;
}

function lineTop(i) {
  const l = [...sr.querySelectorAll('.lp-log-line')];
  if (!l[i]) return null;
  return +(l[i].getBoundingClientRect().top - body.getBoundingClientRect().top).toFixed(1);
}

function state() {
  const br = body.getBoundingClientRect();
  const lines = [...sr.querySelectorAll('.lp-log-line')];
  const rows = lines.map((l) => {
    const b = l.getBoundingClientRect();
    return { top: b.top - br.top, bottom: b.bottom - br.top };
  });
  const n = panel._view.length;
  return {
    scrollTop: body.scrollTop, scrollHeight: body.scrollHeight, clientHeight: body.clientHeight,
    domLines: rows.length,
    // 顶部空白 = 首行顶边在视口顶边之下；底部空白 = 末行底边在视口底边之上
    topGap: rows.length ? +rows[0].top.toFixed(1) : null,
    bottomGap: rows.length ? +(br.height - rows[rows.length - 1].bottom).toFixed(1) : null,
    viewLen: n,
    estHeight: panel._estHeight,
    total: panel._offsets[n],
    avgRow: n ? panel._offsets[n] / n : 0,
    paused: panel._paused,
  };
}

window.__probe = {
  panel,
  push,
  state,
  lineTop,
  scrollTo(v) { body.scrollTop = v; body.dispatchEvent(new Event('scroll')); },
  clickPause() { sr.querySelector('#lp-pause').click(); },
  clickAutoScroll() { sr.querySelector('#lp-autoscroll').click(); },
  lineTextAt(i) {
    const lines = [...sr.querySelectorAll('.lp-log-line')];
    return lines[i] ? lines[i].querySelector('.lp-text').textContent.slice(0, 24) : null;
  },
  resize(w, h) {
    host.style.width = w + 'px';
    host.style.height = h + 'px';
    panel._invalidateHeights();
    panel._renderWindow();
  },
  counters() { return { paint: paintCount, coverage: coverageHits }; },
  resetCounters() { paintCount = 0; coverageHits = 0; },
};
window.__ready = true;
</script>
</body>
</html>
