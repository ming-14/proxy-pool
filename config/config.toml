# proxy-pool 应用配置（唯一配置数据源，由 src/framework/config.py 加载）
# 说明：
# - [paths] 下路径相对项目根（config/ 所在目录的上一级）解析
# - 组全部在 [groups] 定义（组语义由配置决定，代码不硬编码组名）
# - sources 中 pause_ttl 省略表示不主动暂停该源（仅去重率过高时暂停）

# ---------------------------------------------------------------- 缓存与日志路径
[paths]
cache_file = ".cache"        # 代理池状态持久化文件（相对项目根）
log_dir = "logs"             # 日志目录（相对项目根）

# ---------------------------------------------------------------- 代理池
[pool]
max_fails = 2                # 普通组代理失败次数 >= 该值后不再参与可用集合
trusted_max_fails = 3        # 信任池组代理的失败上限（容错更高）

# ---------------------------------------------------------------- 代理分组（组全部在此定义）
# 组名 -> { ttl, role?, requestable? }
# - ttl:          整数秒数，超过自动清除（见 ProxyPool._cleanup_all_expired）；"never" 永不过期
# - role:         特殊语义组，每个角色必须恰好一个：
#                 "trusted"   信任池：请求成功代理的晋级目标，永不过期
#                 "blacklist" 黑名单：失败淘汰代理的归属，不可请求
#                 "standby"   serve 备用队列：pproxy 上游，由心跳探测维护
# - requestable:  是否参与可用集合（request/get 命令可从中取代理，默认 false）
[groups]
"default-http" = { ttl = 3600, requestable = true }              # API 源的 HTTP 代理，1 小时
"default-https" = { ttl = 3600, requestable = true }             # API 源的 HTTPS 代理
"default-socks5" = { ttl = 3600, requestable = true }            # API 源的 SOCKS5 代理
"freeproxy-world-http" = { ttl = 18000, requestable = true }     # FreeProxy.World 的 HTTP 代理，5 小时（与该源暂停时长一致）
"freeproxy-world-https" = { ttl = 18000, requestable = true }    # FreeProxy.World 的 HTTPS 代理
"freeproxy-world-socks5" = { ttl = 18000, requestable = true }   # FreeProxy.World 的 SOCKS5 代理
"Proxy-pool-standby-queue" = { ttl = "never", role = "standby", requestable = true }   # serve 备用队列（pproxy 上游），由心跳探测维护
"trusted" = { ttl = "never", role = "trusted", requestable = true }   # 成功使用过的代理，永不过期
"blacklist" = { ttl = 10800, role = "blacklist" }                # 失败过多的代理，3 小时后过期可重新入池

# ---------------------------------------------------------------- 拉取调度
[fetch]
source_pause_ttl = 1200        # 源暂停默认时长（去重率过高时使用），秒
source_dedup_threshold = 0.92  # 源去重率阈值，超过则暂停该源
fetch_proxy_retries = 3        # 每个代理源拉取时的最大重试次数

# ---------------------------------------------------------------- 代理源
# name:            源模块导入路径（同时是源暂停记录 key）
# group:           拉取到的代理入组名
# enabled:         是否启用
# pause_ttl:       每次拉取后暂停该源的时长（秒），省略表示不主动暂停
# group_by_protocol: 按代理 scheme 前缀分拣入组（组名 = group + "-" + scheme），
#                   多协议源（freeproxy_world 产出 http/https/socks5）置 true
[[sources]]
name = "src.interfaces.sources.proxy_scdn"
group = "default"
enabled = true
group_by_protocol = true

[[sources]]
name = "src.interfaces.sources.ip89"
group = "default"
enabled = true
group_by_protocol = true

[[sources]]
name = "src.interfaces.sources.goodips"
group = "default"
enabled = true
group_by_protocol = true

[[sources]]
name = "src.interfaces.sources.geonode"
group = "default"
enabled = true
group_by_protocol = true

[[sources]]
name = "src.interfaces.sources.freeproxy_world"
group = "freeproxy-world"
enabled = true
pause_ttl = 18000             # 多阶段爬取较重，拉完统一暂停 5 小时
group_by_protocol = true

# ---------------------------------------------------------------- 本地代理服务器（serve 命令）
[server]
host = "127.0.0.1"                # 监听地址
port = 8080                       # 监听端口
standby_queue_capacity = 10       # 备用队列组容量上限（serve 探测补入）
# 备用队列填充候选数公式：缺口 × standby_fill_probe_multiplier，且至少 缺口 + standby_fill_probe_min_extra。
# 倍率越高，一次探测补进缺口量的成功率越高（存活率 ~12% 时 8 倍可覆盖），探测开销也越大。
standby_fill_probe_multiplier = 8
standby_fill_probe_min_extra = 10
# 备用队列填充候选组（按优先级顺序，靠前优先；应从可请求组中选择）。
# trusted 排最前保证已验证代理优先入队，不足再按序从其它组补。
standby_fill_groups = [
    "trusted",
    "freeproxy-world-http",
    "freeproxy-world-https",
    "freeproxy-world-socks5",
    "default-http",
    "default-https",
    "default-socks5",
]
heartbeat_interval = 2            # 心跳间隔秒：定时探测备用队列内代理
heartbeat_probe_url = "https://httpbin.org/ip"  # 心跳探测目标 URL
heartbeat_concurrency = 16        # 心跳探测并发数
heartbeat_timeout = 3             # 心跳探测单个代理超时秒数
# 允许的代理类型。不含 https：https 代理在 pproxy 中是 TLS 终结（http+ssl:// 上游），
# 浏览器访问 https 目标会拿到上游证书导致 ERR_CERT_AUTHORITY_INVALID；
# http/socks5 均为透传，无此问题。
serve_proxy_types = ["http", "socks5"]
