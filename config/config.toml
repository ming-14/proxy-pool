# proxy-pool 全局配置：路径与 Web 面板
# 配置按领域拆分（均由 src/framework/config.py 固定文件名加载，节不可跨文件放置）：
#   config.toml   本节：[paths] 路径 + [web] 面板开关/端口
#   pool.toml     池策略：[pool] 晋级/淘汰阈值 + [groups] 分组定义
#   sources.toml  代理源：[fetch] 拉取调度 + [[sources]] 源列表
#   serve.toml    serve 调度：[server] 端口/队列/心跳/链路门控/metrics
#   panel.toml    面板功能：[geoip] IP 归属地图
#   ippure.toml   IP 纯净度检查：[ippure] 开关与通用参数 + [[plugins]] 检查源插件 + [[proxy_rules]] 代理规则
# 说明：
# - [paths] 下路径相对项目根（config/ 所在目录的上一级）解析
# - 组全部在 pool.toml [groups] 定义（组语义由配置决定，代码不硬编码组名）
# - 密钥不入 TOML：config/.env（加载时注入环境变量，git 忽略）

# ---------------------------------------------------------------- 缓存与日志路径
[paths]
cache_db = ".cache.db"       # 代理池状态持久化 SQLite 数据库（相对项目根，WAL 模式）
log_dir = "logs"             # 日志目录（相对项目根）
autoload = "autoload"        # 启动时自动加载的代理清单文件（相对项目根，一行一个，# 注释）

# ---------------------------------------------------------------- Web 控制面板（serve 模式）
[web]
enabled = true                    # 面板总开关
host = "0.0.0.0"                  # 面板监听地址
port = 8083                       # 面板监听端口
