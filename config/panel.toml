# 面板功能：IP 归属地图 / 3D 地球与目标地区探测（加载器见 src/framework/config.py）
# IP 纯净度检查配置见 ippure.toml

# ---------------------------------------------------------------- IP 归属地（Web 地图）
[geoip]
enabled = true                     # 地图/归属定位开关
# GeoLite2 离线数据库（相对项目根，MaxMind GeoLite2 或 P3TERX/GeoLite.mmdb 构建版）。
# 支持 City / Country 两种库：
#   GeoLite2-City.mmdb    城市级（省/市/经纬度，地图散点精度高，约 60MB）
#   GeoLite2-Country.mmdb 国家级（仅国家，地图散点用内置国家中心坐标兜底，约 5MB）
db_file = "vendor/geoip/GeoLite2-City.mmdb"
# 定位结果缓存有效期秒：IP 段归属变化以月计，90 天内不重复解析 mmdb
cache_ttl = 7776000

# ---------------------------------------------------------------- 3D 地球与目标地区探测（依赖 [geoip]）
[globe]
enabled = true                 # 地球开关（依赖 geoip.enabled；false 时不注册 /api/globe、不探测）
# 本机坐标（手填，不自动探测；决定本机节点与「本机→代理」弧）：两者缺省 = 不画本机
# self_lat = 39.9
# self_lng = 116.4
max_flows = 60                 # 下发给地球的最大弧分组数（按速率取 top N）
probe_concurrency = 3          # DoH 探测并发上限
probe_timeout = 8              # 单次 DoH 超时秒
target_cache_ttl = 86400       # (代理,目标) 缓存有效期秒（过期且仍有流量才重探）
activation_window = 60         # 最近多少秒内有 /api/globe 请求才探测（面板打开才消耗代理）
probe_window = 600             # 窗口内有流量的 pair 才作为探测候选
prune_after = 2592000          # 缓存行清理阈值秒（30 天未刷新即删，目标域名不留长期痕迹）
doh_endpoints = ["https://cloudflare-dns.com/dns-query", "https://dns.google/resolve", "https://223.5.5.5/resolve"]  # 顺序即回退顺序

# ---------------------------------------------------------------- 流量统计
# 历史流量条目（按「代理-域名-IP」分区，IP 变动即新条目）；全局/按代理的实时计数不落盘。
[traffic]
history_limit = 500            # 历史条目下发上限（按流量总计降序取前 N 条）
flush_interval = 15            # 历史条目落盘节流秒（越小越实时，写库越频繁）
retention = 2592000            # 历史条目保留期秒（30 天无活动即删，防表无限增长）
