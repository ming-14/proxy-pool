# 代理源与拉取调度（加载器见 src/framework/config.py）
# 说明：sources 中 pause_ttl 省略表示不主动暂停该源（仅去重率过高时暂停）
# github_lists 为 GitHub 静态列表源，镜像前缀取环境变量 GITHUB_LISTS_MIRROR
# （未设置或为空 = 直连；raw.githubusercontent.com 在部分网络直连被 SSL 中断，此时在 config/.env 配镜像）

# ---------------------------------------------------------------- 拉取调度
[fetch]
source_pause_ttl = 1200        # 源暂停默认时长（去重率过高时使用），秒
source_dedup_threshold = 0.92  # 源去重率阈值，超过则暂停该源
fetch_proxy_retries = 3        # 每个代理源拉取时的最大重试次数

# FreeProxy.World 源专属参数（多阶段爬取的并发/限流/超时/请求头）
[fetch.freeproxy_world]
max_concurrent = 16            # 并发爬取页面的最大并发数
proxy_retry = 1                # 单代理连续失败上限（超过丢弃）
task_interval = 2              # 任务间隔秒（限流，避免触发反爬）
request_timeout = 15           # 单页面请求超时秒
accept_language = "en-US,en;q=0.9"  # Accept-Language 头（中性值，不暴露地理线索）

# ---------------------------------------------------------------- 代理源
# name:            源模块导入路径（同时是源暂停记录 key）
# group:           拉取到的代理入组名
# enabled:         是否启用
# pause_ttl:       每次拉取后暂停该源的时长（秒），省略表示不主动暂停
# group_by_protocol: 按代理 scheme 前缀分拣入组（组名 = group + "-" + scheme），
#                   多协议源（freeproxy_world 产出 http/https/socks5）置 true
[[sources]]
name = "src.interfaces.sources.proxy_scdn"
group = "default"
enabled = true
group_by_protocol = true

[[sources]]
name = "src.interfaces.sources.ip89"
group = "default"
enabled = true
group_by_protocol = true

[[sources]]
name = "src.interfaces.sources.goodips"
group = "default"
enabled = true
group_by_protocol = true

[[sources]]
name = "src.interfaces.sources.geonode"
group = "default"
enabled = true
group_by_protocol = true

# 以下四个为免费代理 JSON/文本 API 源（接入前做过存活率抽检）
[[sources]]
name = "src.interfaces.sources.hproxy"
group = "default"
enabled = true
group_by_protocol = true

[[sources]]
name = "src.interfaces.sources.proxyscrape"
group = "default"
enabled = true
group_by_protocol = true

[[sources]]
name = "src.interfaces.sources.proxylister"
group = "default"
enabled = true
group_by_protocol = true

# imtaqin 响应约 9MB/5 万条且与其它源高度重合：固定 1 天后再拉，
# 否则默认「去重率过高暂停 20 分钟」会反复下载 9MB
[[sources]]
name = "src.interfaces.sources.imtaqin"
group = "default"
enabled = true
pause_ttl = 86400
group_by_protocol = true

[[sources]]
name = "src.interfaces.sources.freeproxy_world"
group = "freeproxy-world"
enabled = true
pause_ttl = 1800000
group_by_protocol = true

# GitHub 静态列表：96 条列表合并为一个源（http 59 / https 11 / socks5 26），
# 条目自带 scheme 或按列表协议补全
[[sources]]
name = "src.interfaces.sources.github_lists"
group = "github"
enabled = true
pause_ttl = 86400
group_by_protocol = true

# ---------------------------------------------------------------- 入池筛选规则
# 命中即拉黑（进黑名单组，ttl 内不再入池）。对完整代理 URL（含 scheme）做正则匹配，
# 按书写顺序取首个命中，无命中即正常入池。
#   pattern: 正则（re.search 语义，要全串锚定自己写 ^...$）
#   reason:  命中原因（日志展示）
#   match:   源名 glob，省略 = 全部源
[[fetch_filter]]
pattern = ":80$"
reason = "端口 80 为 Cloudflare 假代理（CONNECT 400）"

