<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self';" />
  <title>proxy-pool 启动器</title>
  <link rel="stylesheet" href="launcher.css" />
</head>
<body>
  <!-- 只保留代理端口与启动：网页端口由程序自选，停止/重启/退出都在托盘菜单 -->
  <main class="app">
    <label class="field-label" for="proxy-port">代理端口</label>
    <div class="row">
      <input id="proxy-port" type="number" min="1" max="65535" step="1" inputmode="numeric" />
      <button id="btn-start" class="btn" type="button">启动</button>
    </div>
  </main>

  <script src="launcher.js"></script>
</body>
</html>
